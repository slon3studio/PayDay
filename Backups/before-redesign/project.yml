name: Worker
options:
  bundleIdPrefix: com.worker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Worker:
    type: application
    platform: iOS
    sources:
      - path: Worker
    dependencies:
      - target: WorkerWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worker.Worker
        PRODUCT_NAME: Worker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: Worker
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  # Hosts the Lock Screen Live Activity. A Live Activity can only live in a
  # widget extension — but it needs no entitlement, so this still works on a
  # free personal team.
  WorkerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WorkerWidgets
      # Shared with the app so both sides agree on jobs, formatting and the
      # activity payload.
      - path: Worker/Models/Job.swift
      - path: Worker/Support/Formatters.swift
      - path: Worker/Shared
    # An explicit plist: NSExtension is a nested dictionary, which the
    # INFOPLIST_KEY_ build settings can't express.
    info:
      path: WorkerWidgets/Info.plist
      properties:
        CFBundleDisplayName: Worker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worker.Worker.Widgets
        PRODUCT_NAME: WorkerWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
