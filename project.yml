name: PayDay
options:
  bundleIdPrefix: com.slon3studio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PayDay:
    type: application
    platform: iOS
    sources:
      - path: PayDay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slon3studio.PayDay
        PRODUCT_NAME: PayDay
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: PayDay
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Your paid personal team — needed for iCloud.
        DEVELOPMENT_TEAM: 2FV64X6H3S
    # iCloud sync: SwiftData mirrors the store into this container's private
    # database, signed in with whatever Apple ID the phone uses — no login in
    # the app. Remote notifications are how CloudKit says something changed.
    # Xcode's Signing & Capabilities tab also wants the capabilities listed
    # in the project's target attributes, which xcodegen can't write in the
    # right shape — `generate.sh` adds them. Use it instead of plain xcodegen.
    entitlements:
      path: PayDay/PayDay.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.slon3studio.PayDay]
        aps-environment: development
    info:
      path: PayDay/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        # The only encryption here is the HTTPS CloudKit speaks, which is
        # exempt. Declaring it means App Store Connect stops asking on
        # every single upload.
        ITSAppUsesNonExemptEncryption: false

# Spelled out so the scheme is shared and survives regenerating the project.
schemes:
  PayDay:
    build:
      targets:
        PayDay: all
    run:
      config: Debug
    archive:
      config: Release
